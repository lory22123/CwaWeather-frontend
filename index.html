<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>夢的天氣 | Sky Seasons</title>
    
    <link rel="icon" type="image/png" href="./icon-v2.png">
    
    <link rel="apple-touch-icon" href="./icon-v2.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        :root {
            /* 預設變數 (會在 JS 中動態切換) */
            --bg-grad-start: #2b3a67;
            --bg-grad-end: #d68e72;
            --card-bg: rgba(255, 255, 255, 0.15);
            --card-border: rgba(255, 255, 255, 0.3);
            --text-color: #fff;
            --accent-color: #FFD700; /* 重點色：金 */
            
            /* 動畫速度 */
            --cloud-speed: 60s;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            min-height: 100vh;
            color: var(--text-color);
            padding-bottom: 40px;
            overflow-x: hidden;
            background-color: #333; /* 載入前底色 */
            transition: background 1s ease;
        }

        /* === 背景層 (天空與光影) === */
        .sky-background {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2;
            background: linear-gradient(180deg, var(--bg-grad-start) 0%, var(--bg-grad-end) 100%);
            transition: opacity 1s ease, background 1s ease;
        }

        /* 太陽 / 月亮 (光源) */
        .celestial-body {
            position: fixed;
            top: 10%; right: 10%;
            width: 120px; height: 120px;
            border-radius: 50%;
            z-index: -2;
            transition: all 1s ease;
            filter: blur(20px);
        }
        /* 白天模式：太陽 */
        body.is-day .celestial-body {
            background: radial-gradient(circle, #fff 20%, #ffcc00 60%, transparent 80%);
            box-shadow: 0 0 80px #ffcc00;
            opacity: 0.8;
            transform: translateY(0);
        }
        /* 晚上模式：月亮 */
        body.is-night .celestial-body {
            background: radial-gradient(circle, #fff 20%, #a4bfef 60%, transparent 80%);
            box-shadow: 0 0 50px #a4bfef;
            top: 15%; right: 15%;
            width: 80px; height: 80px;
            opacity: 0.9;
        }

        /* 流動的雲朵 (純 CSS 繪製) */
        .cloud-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            opacity: 0; transition: opacity 2s;
            pointer-events: none;
        }
        body.is-day .cloud-layer { opacity: 0.8; }
        
        .cloud {
            position: absolute;
            background: radial-gradient(circle, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0) 60%);
            border-radius: 50%;
            filter: blur(20px);
            animation: floatCloud var(--cloud-speed) linear infinite;
        }
        /* 隨機配置幾朵雲 */
        .c1 { width: 300px; height: 200px; top: 20%; left: -20%; animation-duration: 45s; }
        .c2 { width: 400px; height: 250px; top: 50%; left: -30%; animation-duration: 60s; animation-delay: -20s; }
        .c3 { width: 250px; height: 150px; top: 10%; left: -10%; animation-duration: 50s; animation-delay: -10s; }

        @keyframes floatCloud {
            0% { transform: translateX(0) scale(1); }
            100% { transform: translateX(120vw) scale(1.1); }
        }

        /* 星光層 */
        .star-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background-image: radial-gradient(white 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0;
            transition: opacity 2s;
        }
        body.is-night .star-layer { opacity: 0.5; animation: twinkle 5s infinite; }
        @keyframes twinkle { 0%,100%{opacity:0.3;} 50%{opacity:0.6;} }

        /* === UI 介面 === */
        
        /* 頂部導航區：六都按鈕 */
        .nav-container {
            position: sticky; top: 0; z-index: 100;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(15px);
            padding: 15px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .city-scroll-wrapper {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding: 0 20px;
            scrollbar-width: none;
            align-items: center;
        }
        .city-scroll-wrapper::-webkit-scrollbar { display: none; }

        /* 六都按鈕樣式 */
        .city-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.3s;
            flex-shrink: 0;
        }
        .city-btn:hover { background: rgba(255,255,255,0.3); }
        .city-btn.active {
            background: var(--accent-color);
            color: #333;
            border-color: var(--accent-color);
            box-shadow: 0 0 15px var(--accent-color);
        }

        /* 更多縣市下拉選單 */
        .more-city-select {
            appearance: none;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: rgba(255,255,255,0.7);
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            outline: none;
            margin-left: 10px;
        }
        .more-city-select option { background: #333; color: white; }

        /* 主要內容容器 */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        /* === 儀表板區域 (Hero Dashboard) === */
        .hero-dashboard {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
            margin-top: 10px;
        }

        /* 主天氣卡片 */
        .main-weather-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 35px;
            padding: 30px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 240px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: all 0.5s ease;
        }
        
        /* 城市專屬色光暈 */
        .main-weather-card::before {
            content: ''; position: absolute; top:-50%; left:-50%; width:200%; height:200%;
            background: radial-gradient(circle, var(--accent-color) 0%, transparent 60%);
            opacity: 0.15; z-index: 0; pointer-events: none;
        }

        .main-content-wrap { position: relative; z-index: 2; }
        
        .main-icon {
            font-size: 4.5rem;
            filter: drop-shadow(0 0 20px rgba(255,255,255,0.5));
            animation: float 4s ease-in-out infinite;
            margin-bottom: 10px;
        }
        .main-temp { font-size: 4.5rem; font-weight: 900; line-height: 1; text-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .main-desc { font-size: 1.4rem; opacity: 0.9; margin-left: 5px; font-weight: 700; }
        .main-date {
            margin-top: 15px; display: inline-block;
            background: rgba(0,0,0,0.2); padding: 5px 12px;
            border-radius: 15px; font-size: 0.85rem;
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* 光之子角色 */
        .sky-kid {
            position: absolute; bottom: 20px; right: 20px; z-index: 5;
            transform: scale(0.7); transform-origin: bottom right;
        }
        .kid-head {
            width: 30px; height: 30px; background: #fff; border-radius: 50%;
            box-shadow: 0 0 15px #fff; position: relative; z-index: 2;
        }
        .kid-cape {
            width: 40px; height: 45px; background: #ff5e57;
            clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
            margin-top: -10px; position: relative; z-index: 1;
            background-image: radial-gradient(circle, var(--accent-color) 2px, transparent 2px);
            background-size: 12px 12px; background-position: center 10px;
            transition: background 0.5s;
        }

        /* 資訊小方塊 */
        .info-grid { display: grid; grid-template-rows: 1fr 1fr; gap: 15px; }
        .info-card {
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--card-border);
            border-radius: 25px;
            padding: 15px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            backdrop-filter: blur(10px);
            transition: transform 0.2s;
        }
        .info-card:active { transform: scale(0.95); }
        .info-icon { font-size: 1.6rem; margin-bottom: 5px; color: var(--accent-color); }
        .info-title { font-size: 0.9rem; font-weight: 700; opacity: 0.9; }
        .info-val { font-size: 0.85rem; opacity: 0.7; margin-top: 2px; }

        /* === 三日預報 === */
        .section-header {
            text-align: center; margin-bottom: 20px;
            font-size: 1.1rem; font-weight: 700; letter-spacing: 2px;
            color: var(--accent-color); display: flex; align-items: center; justify-content: center;
        }
        .section-header::before, .section-header::after { content: '✧'; margin: 0 10px; font-size: 0.8rem; }

        .forecast-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        
        .day-card {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            border-radius: 22px; padding: 20px 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            position: relative; overflow: hidden;
            border: 2px solid white;
        }
        .day-title { font-size: 0.9rem; font-weight: 900; color: #555; margin-bottom: 5px; }
        .day-date { font-size: 0.75rem; color: #888; margin-bottom: 10px; }
        .day-icon { font-size: 2.5rem; margin-bottom: 8px; }
        .day-temp { font-size: 0.85rem; font-weight: 700; color: #666; }

        /* RWD */
        @media (max-width: 600px) {
            .hero-dashboard { grid-template-columns: 1fr; }
            .info-grid { grid-template-columns: 1fr 1fr; grid-template-rows: auto; }
            .forecast-row { overflow-x: auto; padding-bottom: 10px; }
            .day-card { min-width: 100px; }
        }

        /* Loading & Animation */
        #loading {
            position: fixed; inset: 0; background: #222; z-index: 999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        @keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-10px);} }
        #errorLog { display:none; position:fixed; bottom:0; left:0; width:100%; background:rgba(0,0,0,0.8); color:#ff5555; padding:10px; z-index:1000; font-size:12px;}

    </style>
</head>

<body class="is-day"> <div class="sky-background"></div>
    <div class="celestial-body"></div> <div class="cloud-layer">
        <div class="cloud c1"></div>
        <div class="cloud c2"></div>
        <div class="cloud c3"></div>
    </div>
    <div class="star-layer"></div>

    <div id="errorLog"></div>

    <div id="loading">
        <div style="font-size: 3rem; animation: float 1s infinite; filter: drop-shadow(0 0 20px gold);">✦</div>
        <p style="color: white; margin-top: 15px; letter-spacing: 2px; font-size: 0.9rem;">連結星圖中...</p>
    </div>

    <div class="nav-container">
        <div class="city-scroll-wrapper">
            <button class="city-btn active" onclick="selectCity('臺北市')" data-city="臺北市">臺北</button>
            <button class="city-btn" onclick="selectCity('新北市')" data-city="新北市">新北</button>
            <button class="city-btn" onclick="selectCity('桃園市')" data-city="桃園市">桃園</button>
            <button class="city-btn" onclick="selectCity('臺中市')" data-city="臺中市">臺中</button>
            <button class="city-btn" onclick="selectCity('臺南市')" data-city="臺南市">臺南</button>
            <button class="city-btn" onclick="selectCity('高雄市')" data-city="高雄市">高雄</button>
            
            <div style="width:1px; height:20px; background:rgba(255,255,255,0.3); margin:0 5px;"></div>

            <select id="moreCitySelect" class="more-city-select" onchange="selectCity(this.value)">
                <option value="" disabled selected>其他...</option>
                <option value="基隆市">基隆</option>
                <option value="新竹市">新竹市</option>
                <option value="新竹縣">新竹縣</option>
                <option value="苗栗縣">苗栗</option>
                <option value="彰化縣">彰化</option>
                <option value="南投縣">南投</option>
                <option value="雲林縣">雲林</option>
                <option value="嘉義市">嘉義市</option>
                <option value="嘉義縣">嘉義縣</option>
                <option value="屏東縣">屏東</option>
                <option value="宜蘭縣">宜蘭</option>
                <option value="花蓮縣">花蓮</option>
                <option value="臺東縣">臺東</option>
                <option value="澎湖縣">澎湖</option>
                <option value="金門縣">金門</option>
                <option value="連江縣">馬祖</option>
            </select>
        </div>
    </div>

    <div class="container" id="mainContent" style="display: none; opacity: 0; transition: opacity 0.8s;">
        
        <div class="hero-dashboard">
            <div class="main-weather-card">
                <div class="main-content-wrap">
                    <div class="main-icon" id="heroIcon">☁️</div>
                    <div class="main-temp" id="heroTemp">--°</div>
                    <div class="main-desc" id="heroDesc">載入中</div>
                    <br>
                    <div class="main-date" id="heroDate">--/--</div>
                </div>
                
                <div class="sky-kid">
                    <div class="kid-head"></div>
                    <div class="kid-cape"></div>
                </div>
            </div>

            <div class="info-grid">
                <div class="info-card">
                    <div class="info-icon" id="adviceRainIcon">🌂</div>
                    <div class="info-title" id="adviceRainText">--</div>
                    <div class="info-val" id="adviceRainVal">--%</div>
                </div>
                <div class="info-card">
                    <div class="info-icon" id="adviceClothIcon">👕</div>
                    <div class="info-title" id="adviceClothText">--</div>
                    <div class="info-val" id="adviceTempRange">--</div>
                </div>
            </div>
        </div>

        <div class="section-header">未來旅程</div>
        <div class="forecast-row" id="forecastRow">
            </div>

    </div>

    <script>
        // 錯誤捕捉
        window.onerror = function(msg, url, line) {
            const errorBox = document.getElementById('errorLog');
            errorBox.style.display = 'block';
            errorBox.textContent = `Error: ${msg}\nLine: ${line}`;
            document.getElementById('loading').style.display = 'none';
        };

        const API_BASE = "https://weather-service.zeabur.app/api/weather";
        const loadingScreen = document.getElementById('loading');
        const mainContent = document.getElementById('mainContent');
        const moreCitySelect = document.getElementById('moreCitySelect');

        // 城市主題色配置 (背景色調 + 強調色)
        // 格式: [背景上漸層, 背景下漸層, 強調色(文字/按鈕)]
        const CITY_THEMES = {
            '臺北市': ['#4e54c8', '#8f94fb', '#a0e9ff'], // 科技藍
            '新北市': ['#1a2980', '#26d0ce', '#76f2e2'], // 海洋青
            '桃園市': ['#56ab2f', '#a8e063', '#d4fc79'], // 草原綠
            '臺中市': ['#FF8008', '#FFC837', '#ffe259'], // 陽光橘
            '臺南市': ['#e65c00', '#F9D423', '#ffcda5'], // 古蹟磚紅
            '高雄市': ['#0083B0', '#00B4DB', '#72efff'], // 港都藍
            'default': ['#2b3a67', '#d68e72', '#FFD700'] // Sky 經典色
        };

        // 統一處理城市選擇
        function selectCity(cityName) {
            // 1. 更新按鈕狀態
            document.querySelectorAll('.city-btn').forEach(btn => {
                if(btn.dataset.city === cityName) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            // 2. 如果是選單選的，重置按鈕
            if(!['臺北市','新北市','桃園市','臺中市','臺南市','高雄市'].includes(cityName)){
                document.querySelectorAll('.city-btn').forEach(btn => btn.classList.remove('active'));
            }

            // 3. 呼叫 API
            fetchWeather(cityName);
        }

        // 更新背景主題 (日夜 + 城市顏色)
        function updateTheme(cityName, isNight) {
            const root = document.documentElement;
            const theme = CITY_THEMES[cityName] || CITY_THEMES['default'];
            
            // 設定強調色
            root.style.setProperty('--accent-color', theme[2]);

            // 切換日夜 Class (控制雲朵、星星、太陽月亮)
            if (isNight) {
                document.body.classList.add('is-night');
                document.body.classList.remove('is-day');
                // 晚上：背景深邃一點，混入城市主題色
                root.style.setProperty('--bg-grad-start', '#0f2027'); 
                root.style.setProperty('--bg-grad-end', theme[0]); // 使用主題色的深色端
            } else {
                document.body.classList.add('is-day');
                document.body.classList.remove('is-night');
                // 白天：明亮漸層
                root.style.setProperty('--bg-grad-start', theme[0]);
                root.style.setProperty('--bg-grad-end', theme[1]);
            }
        }

        function getWeatherIcon(weather) {
            if (!weather) return "✨";
            if (weather.includes("晴")) return "☀️";
            if (weather.includes("多雲")) return "⛅";
            if (weather.includes("陰")) return "☁️";
            if (weather.includes("雨")) return "🌧️";
            if (weather.includes("雷")) return "⛈️";
            return "🌤️";
        }

        function getAdvice(rainProb, maxTemp) {
            const rain = parseInt(rainProb) || 0;
            const temp = parseInt(maxTemp) || 25;
            
            let rIcon="🌂", rText="光翼乾燥";
            if(rain > 30) { rIcon="☔"; rText="能量消散"; }
            
            let cIcon="🧣", cText="微風徐徐";
            if(temp >= 28) { cIcon="🦋"; cText="暖光照耀"; }
            else if(temp <= 20) { cIcon="🧥"; cText="寒風凜冽"; }
            
            return { rIcon, rText, cIcon, cText };
        }

        function renderWeather(locationData) {
            const forecasts = locationData.forecasts;
            const current = forecasts[0];
            const cityName = locationData.city; // 假設 API 回傳有 city 名稱

            // 判斷日夜 (簡單邏輯：6點到18點為白天)
            const hour = new Date().getHours();
            const isNight = (hour < 6 || hour >= 18);
            
            // 觸發主題更新
            updateTheme(cityName, isNight);
            
            // 渲染 Hero
            document.getElementById('heroIcon').textContent = getWeatherIcon(current.weather);
            document.getElementById('heroTemp').textContent = Math.round((parseInt(current.maxTemp)+parseInt(current.minTemp))/2) + "°";
            document.getElementById('heroDesc').textContent = current.weather;
            
            const now = new Date();
            const days = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];
            document.getElementById('heroDate').textContent = `${now.getMonth()+1}/${now.getDate()} ${days[now.getDay()]}`;

            // 建議
            const advice = getAdvice(current.rain, current.maxTemp);
            document.getElementById('adviceRainIcon').textContent = advice.rIcon;
            document.getElementById('adviceRainText').textContent = advice.rText;
            document.getElementById('adviceRainVal').textContent = `💧 ${current.rain}`;

            document.getElementById('adviceClothIcon').textContent = advice.cIcon;
            document.getElementById('adviceClothText').textContent = advice.cText;
            document.getElementById('adviceTempRange').textContent = `🌡️ ${current.minTemp} ~ ${current.maxTemp}`;

            // 預報
            const forecastRow = document.getElementById('forecastRow');
            forecastRow.innerHTML = '';
            const threeDays = forecasts.slice(0, 3);
            const dayLabels = ["今天", "明天", "後天"];

            threeDays.forEach((f, index) => {
                const label = dayLabels[index] || "未來";
                const fDate = new Date(f.startTime);
                const dateStr = `${fDate.getMonth()+1}/${fDate.getDate()}`;
                
                forecastRow.innerHTML += `
                    <div class="day-card">
                        <div class="day-title">${label}</div>
                        <div class="day-date">${dateStr}</div>
                        <div class="day-icon">${getWeatherIcon(f.weather)}</div>
                        <div class="day-temp">${f.minTemp}°-${f.maxTemp}°</div>
                    </div>
                `;
            });
        }

        async function fetchWeather(city = "臺北市") {
            try {
                loadingScreen.style.display = 'flex';
                mainContent.style.opacity = '0';
                
                const url = `${API_BASE}?city=${encodeURIComponent(city)}`;
                const res = await fetch(url);
                const json = await res.json();

                if (json.success) {
                    // 將城市名稱塞進 data 方便 renderWeather 使用
                    json.data[0].city = city; 
                    renderWeather(json.data[0]);
                    
                    loadingScreen.style.display = 'none';
                    mainContent.style.display = 'block';
                    setTimeout(() => mainContent.style.opacity = '1', 100);
                } else {
                    throw new Error("No Data");
                }
            } catch (e) {
                alert("連線失敗：" + e.message);
                loadingScreen.style.display = 'none';
            }
        }

        // Init
        selectCity('臺北市');

    </script>
</body>
</html>
